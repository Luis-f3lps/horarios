<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema Merlin - IFNMG</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma; background-color: #f4f7f6; padding: 20px; }
    .btn-gerar { display: block; margin: 0 auto 20px; padding: 15px 30px; background-color: #27ae60; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
    #status { text-align: center; font-weight: bold; margin-bottom: 20px; color: #e67e22; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
    th { background-color: #2980b9; color: white; }
    .aula-card { background-color: #ecf0f1; margin: 5px; padding: 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🧙‍♂️ Sistema Merlin</h1>
  <button class="btn-gerar" onclick="gerarHorarios()">Gerar Horário Geral</button>
  <div id="status">Aguardando...</div>
  <table id="tabela-horarios">
    <thead><tr><th>Turno</th><th>Segunda</th><th>Terça</th><th>Quarta</th><th>Quinta</th><th>Sexta</th></tr></thead>
    <tbody id="corpo-tabela"></tbody>
  </table>

  <script>
    const turnos = ['M1', 'M2', 'T1', 'T2'];
    const dias = ['segunda', 'terca', 'quarta', 'quinta', 'sexta'];

    function gerarHorarios() {
      const statusText = document.getElementById('status');
      const botao = document.querySelector('.btn-gerar');
      botao.disabled = true;
      const source = new EventSource('/api/schedule-stream');

      source.onmessage = function(event) {
        const dados = JSON.parse(event.data);
        if (dados.type === 'progress') statusText.innerText = `Gerando... Geração ${dados.geracao}`;
        else if (dados.type === 'done') {
          renderizarTabela(dados.aulas);
          botao.disabled = false;
          source.close();
        }
      };
    }

    function renderizarTabela(aulas) {
      const tbody = document.getElementById('corpo-tabela');
      tbody.innerHTML = '';
      turnos.forEach(turno => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><strong>${turno}</strong></td>`;
        dias.forEach(dia => {
          const td = document.createElement('td');
          aulas.filter(a => a.dia === dia && a.turno === turno).forEach(aula => {
            td.innerHTML += `<div class="aula-card"><b>${aula.professor}</b><br>${aula.disciplina}</div>`;
          });
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
